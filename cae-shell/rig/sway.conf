# A compositor nobody looks at. One output the size of a laptop panel, with a
# flat backdrop: something has to be behind a translucent surface, or what was
# drawn there last shows through it.
output HEADLESS-1 resolution 1920x1200 position 0,0 scale 1 background #30343c solid_color
xwayland disable
default_border none
focus_follows_mouse no
# The settings are a window, and on the desktop a rule floats it. Tiled, it
# would be the size of the output and tell nothing about how it looks.
for_window [app_id="caelestia-settings"] floating enable
