[package]
name = "caelestia-cli"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Fast front-end for the Caelestia CLI"

# The command every keybind calls. It shadows the Python `caelestia` on PATH
# by living in /usr/local/bin, and hands anything it does not implement back
# to it, so the two can never disagree about a subcommand's behaviour.
[[bin]]
name = "caelestia"
path = "src/main.rs"

[dependencies]
# Only for the JSON subset, which the privileged daemons in system/rust
# already own. Nothing else: this binary is on the critical path of every
# keybind, and its whole reason to exist is that it starts instantly.
redcommon = { path = "../system/rust/redcommon" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
