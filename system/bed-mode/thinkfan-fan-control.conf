# Required for thinkfan / bed-mode to drive the ThinkPad EC fan manually.
# Takes effect on the next boot. Do NOT reload the module by hand to apply it
# sooner: after a kernel upgrade the running kernel's module tree is already
# gone, so `modprobe -r thinkpad_acpi` succeeds and the reload that follows
# cannot find the file — that costs you fan control, the hotkeys and rfkill
# until you reboot anyway. Check whether it is already active with
#   cat /sys/module/thinkpad_acpi/parameters/fan_control
options thinkpad_acpi fan_control=1
