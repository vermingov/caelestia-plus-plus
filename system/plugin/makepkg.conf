# makepkg takes compiler flags from its config and ignores the environment,
# and this machine's config says -march=native -O3: right for a package that
# stays here, an illegal instruction on an older processor for one that is
# shipped. Everything else is the system's own.
source /etc/makepkg.conf

CFLAGS="-march=x86-64 -mtune=generic -O2 -pipe -fno-plt -fexceptions \
        -Wp,-D_FORTIFY_SOURCE=3 -Wformat -Werror=format-security \
        -fstack-clash-protection -fcf-protection"
CXXFLAGS="$CFLAGS -Wp,-D_GLIBCXX_ASSERTIONS"
