[package]
name = "redwalld"
version = "2.0.0"
edition = "2021"
description = "Per-application interactive outbound firewall daemon for Caelestia++"
license = "GPL-3.0-only"

# No dependencies on purpose. This runs as root on every new outbound
# connection; the netlink and JSON it needs are small and explicit, and a
# privileged packet-path daemon should not carry a crate tree it cannot audit.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
